<app-topbar [showLoginButton]="true"></app-topbar>

<div class="container text-center" id="main-container">

    <div class="row justify-content-md-center">
        <div class="col col-lg-8" style="margin-top: 50px;">
            <h2 style="font-size: 50px;">
                Estude em grupo, competindo e se divertindo!
            </h2>
        </div>
    </div>

    <div class="row justify-content-md-center">
        <div class="d-grid gap-2 col-lg-4 col-sm-8 mx-auto" style="margin-top: 100px;">
            <button (click)="goToRegister()" class="btn btn-outline-success btn-lg" type="submit">Comece agora</button>
        </div>
    </div>

</div>
